name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      python_minor:
        description: "Python minor version to embed"
        default: "3.13"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # If this label isn't available on your account, try macos-latest.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PY_MINOR: ${{ inputs.python_minor || '3.13' }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PY_MINOR }}

      - name: Cache Python XCframework
        uses: actions/cache@v4
        with:
          path: Python.xcframework
          key: py-xcframework-${{ env.PY_MINOR }}-${{ github.run_id }}
          restore-keys: py-xcframework-${{ env.PY_MINOR }}-

      - name: Bootstrap (Python runtime, packages, Xcode project)
        run: ./scripts/bootstrap.sh

      - name: Build IPA
        run: |
          brew install xcbeautify
          ./scripts/build_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SealPad-ipa
          path: SealPad.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Attach IPA to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SealPad.ipa
          generate_release_notes: true
